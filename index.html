<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Insight Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="header-eyebrow">Business Intelligence</div>
      <h1>Insight Engine</h1>
      <p class="header-sub">Paste raw data or notes — get structured analysis instantly</p>
    </header>

    <div class="input-panel">
      <div class="panel-label">Input // data or notes</div>
      <textarea id="dataInput" placeholder="Paste anything: CSV rows, meeting notes, sales numbers, customer feedback, KPIs, P&L snippets…"></textarea>
      <div class="samples-row">
        <span class="samples-label">samples →</span>
        <button class="sample-chip" onclick="loadSample('sales')">Sales data</button>
        <button class="sample-chip" onclick="loadSample('feedback')">Customer feedback</button>
        <button class="sample-chip" onclick="loadSample('ops')">Ops notes</button>
      </div>
    </div>

    <button class="run-btn" id="analyzeBtn" onclick="analyze()">
      <div class="spinner" id="spinner"></div>
      <i class="ti ti-sparkles" id="btnIcon"></i>
      <span id="btnText">Analyze data</span>
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="results" id="results">

      <div class="section-head">
        <span class="section-tag">Key insights</span>
        <div class="section-line"></div>
      </div>
      <div id="insights"></div>

      <div class="divider"></div>
      <div class="section-head">
        <span class="section-tag">Risks</span>
        <div class="section-line"></div>
      </div>
      <div id="risks"></div>

      <div class="divider"></div>
      <div class="section-head">
        <span class="section-tag">Recommended action</span>
        <div class="section-line"></div>
      </div>
      <div id="action"></div>

      <div class="results-footer">
        <p class="summary-note" id="footerNote"></p>
        <button class="reset-btn" onclick="reset()">↺ New analysis</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
