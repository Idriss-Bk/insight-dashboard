<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Insight Engine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #f5f5f3;
      --bg3: #efefec;
      --text: #1a1a18;
      --text2: #6b6b67;
      --text3: #a0a09b;
      --border: rgba(0,0,0,0.1);
      --border2: rgba(0,0,0,0.18);
      --info-bg: #e6f1fb;
      --info-text: #0c447c;
      --danger-bg: #fcebeb;
      --danger-text: #a32d2d;
      --danger-border: #e24b4a;
      --success-bg: #eaf3de;
      --success-text: #3b6d11;
      --success-border: #639922;
      --radius: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg2: #252523;
        --bg3: #2e2e2b;
        --text: #f0efe8;
        --text2: #a0a09b;
        --text3: #6b6b67;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.18);
        --info-bg: #042c53;
        --info-text: #85b7eb;
        --danger-bg: #501313;
        --danger-text: #f09595;
        --danger-border: #a32d2d;
        --success-bg: #173404;
        --success-text: #97c459;
        --success-border: #3b6d11;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg3);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text);
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
    }

    .header-text p {
      font-size: 13px;
      color: var(--text2);
      margin-top: 2px;
    }

    .input-zone {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      margin-bottom: 10px;
    }

    .input-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text2);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      line-height: 1.6;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: var(--border2); }
    textarea::placeholder { color: var(--text3); }

    .sample-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .sample-label {
      font-size: 12px;
      color: var(--text3);
    }

    .sample-btn {
      font-size: 12px;
      padding: 4px 10px;
      border: 0.5px solid var(--border2);
      border-radius: 20px;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      transition: background 0.1s;
    }

    .sample-btn:hover { background: var(--bg2); }

    .analyze-btn {
      width: 100%;
      padding: 11px;
      background: var(--bg);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.1s;
      margin-bottom: 8px;
    }

    .analyze-btn:hover:not(:disabled) { background: var(--bg2); }
    .analyze-btn:active:not(:disabled) { transform: scale(0.99); }
    .analyze-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--border);
      border-top-color: var(--text2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .error-msg {
      font-size: 13px;
      color: var(--danger-text);
      background: var(--danger-bg);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-top: 6px;
      display: none;
    }

    .results { display: none; margin-top: 1.5rem; }

    .section-title {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text2);
      margin: 1.25rem 0 0.6rem;
    }

    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0.85rem 1rem;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .card-icon {
      font-size: 16px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .card-label {
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .card-body {
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
    }

    .card-risk {
      border-left: 2px solid var(--danger-border);
      background: var(--danger-bg);
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
    }

    .card-action {
      border-left: 2px solid var(--success-border);
      background: var(--success-bg);
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 0.5px solid var(--border);
    }

    .footer-note {
      font-size: 12px;
      color: var(--text3);
      max-width: 70%;
      line-height: 1.4;
    }

    .reset-btn {
      font-size: 12px;
      padding: 5px 12px;
      border: 0.5px solid var(--border2);
      border-radius: 20px;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
    }

    .reset-btn:hover { background: var(--bg2); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><i class="ti ti-chart-bar"></i></div>
      <div class="header-text">
        <h1>Business Insight Engine</h1>
        <p>Paste messy data or notes → get structured analysis</p>
      </div>
    </div>

    <div class="input-zone">
      <div class="input-label">Your data or notes</div>
      <textarea id="dataInput" placeholder="Paste anything: CSV rows, meeting notes, sales numbers, customer feedback, KPIs, P&L snippets…"></textarea>
      <div class="sample-row">
        <span class="sample-label">Try a sample:</span>
        <button class="sample-btn" onclick="loadSample('sales')">Sales data</button>
        <button class="sample-btn" onclick="loadSample('feedback')">Customer feedback</button>
        <button class="sample-btn" onclick="loadSample('ops')">Ops notes</button>
      </div>
    </div>

    <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">
      <div class="spinner" id="spinner"></div>
      <i class="ti ti-sparkles" id="btnIcon"></i>
      <span id="btnText">Analyze data</span>
    </button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="results" id="results">
      <div class="section-title">3 key insights</div>
      <div id="insights"></div>

      <div class="section-title">2 risks</div>
      <div id="risks"></div>

      <div class="section-title">1 recommended action</div>
      <div id="action"></div>

      <div class="footer-row">
        <p class="footer-note" id="footerNote"></p>
        <button class="reset-btn" onclick="reset()">↺ New analysis</button>
      </div>
    </div>
  </div>

  <script>
    const SAMPLES = {
      sales: `Q1 2024 Sales Data (Regional):
North: $412,000 (target $380k) — 3 reps, avg deal $28k, 14 deals closed
South: $198,000 (target $290k) — 2 reps, avg deal $19k, 10 deals closed
East: $521,000 (target $500k) — 4 reps, avg deal $31k, 17 deals closed
West: $89,000 (target $200k) — 1 rep (other resigned Jan), avg deal $22k, 4 deals
Product mix: SaaS licenses 60%, Pro Services 28%, Support contracts 12%
Churn: 3 customers lost (all SMB tier, $42k ARR total)
Pipeline: $1.1M in stage 3+ deals, avg close probability 38%
New logo wins: 6 this quarter (avg size $25k ARR)`,

      feedback: `Customer support tickets + NPS responses — last 30 days:
NPS score: 34 (down from 51 last quarter)
Top complaints (support tickets):
- Slow loading/performance issues: 47 tickets
- Billing confusion / wrong charges: 31 tickets
- Feature X not working on mobile: 28 tickets
- Onboarding too complex: 19 tickets
- Can't export data: 14 tickets
Positive feedback themes: great customer support team (12 mentions), love the reporting module (9 mentions)
Churn interviews (5 customers): 4 cited performance, 1 cited price
Trial-to-paid conversion: 18% (was 24% 6 months ago)
Support ticket volume up 34% MoM`,

      ops: `Weekly ops standup notes — last 4 weeks:
Wk1: Server outage 3hrs (Mon), lost ~$12k revenue. Root cause: DB migration script. 2 engineers OOO.
Wk2: Shipping delays from supplier — 4 orders >7 days late. Customers complaining. Inventory low on SKU-332 and SKU-441.
Wk3: New hire onboarding — 2 engineers started. Deploy pipeline broken for 2 days. Sales team closed record $180k week.
Wk4: Supply chain issue resolved. Still missing SLA on 6 open enterprise support tickets. Finance flagged COGS up 18% vs last quarter. Marketing campaign launched — early CTR good (3.2%).`
    };

    function loadSample(key) {
      document.getElementById('dataInput').value = SAMPLES[key];
    }

    function reset() {
      document.getElementById('dataInput').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('btnText').textContent = 'Analyze data';
    }

    async function analyze() {
      const data = document.getElementById('dataInput').value.trim();
      if (!data) return;

      const btn = document.getElementById('analyzeBtn');
      const spinner = document.getElementById('spinner');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');

      btn.disabled = true;
      spinner.style.display = 'block';
      btnIcon.style.display = 'none';
      btnText.textContent = 'Analyzing…';
      errorMsg.style.display = 'none';
      document.getElementById('results').style.display = 'none';

      const prompt = `You are a sharp business analyst. Analyze the data below and return ONLY a valid JSON object (no markdown, no preamble) with this exact structure:

{
  "insights": [
    {"title": "short title", "body": "1-2 sentence insight with specific numbers where available"},
    {"title": "short title", "body": "1-2 sentence insight"},
    {"title": "short title", "body": "1-2 sentence insight"}
  ],
  "risks": [
    {"title": "short risk title", "body": "1-2 sentence risk with urgency and impact"},
    {"title": "short risk title", "body": "1-2 sentence risk"}
  ],
  "action": {
    "title": "single most important action",
    "body": "2-3 sentences: what to do, who should own it, expected outcome"
  },
  "summary": "one plain-English sentence summarizing what this data is about"
}

Be specific, opinionated, direct. Cite numbers. No generic platitudes.

DATA:
${data}`;

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            messages: [{ role: 'user', content: prompt }]
          })
        });

        const json = await res.json();
        const text = json.content?.map(b => b.text || '').join('');
        const clean = text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(clean);
        renderResults(parsed);
      } catch (e) {
        errorMsg.textContent = 'Analysis failed — check your data and try again.';
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnIcon.style.display = '';
        btnText.textContent = 'Analyze again';
      }
    }

    function renderResults(p) {
      document.getElementById('insights').innerHTML = p.insights.map(i => `
        <div class="card">
          <i class="ti ti-bulb card-icon" style="color:var(--info-text)"></i>
          <div>
            <div class="card-label" style="color:var(--info-text)">${i.title}</div>
            <div class="card-body">${i.body}</div>
          </div>
        </div>`).join('');

      document.getElementById('risks').innerHTML = p.risks.map(r => `
        <div class="card card-risk">
          <i class="ti ti-alert-triangle card-icon" style="color:var(--danger-text)"></i>
          <div>
            <div class="card-label" style="color:var(--danger-text)">${r.title}</div>
            <div class="card-body">${r.body}</div>
          </div>
        </div>`).join('');

      document.getElementById('action').innerHTML = `
        <div class="card card-action">
          <i class="ti ti-arrow-right card-icon" style="color:var(--success-text)"></i>
          <div>
            <div class="card-label" style="color:var(--success-text)">${p.action.title}</div>
            <div class="card-body">${p.action.body}</div>
          </div>
        </div>`;

      document.getElementById('footerNote').textContent = p.summary || '';
      document.getElementById('results').style.display = 'block';
    }
  </script>
</body>
</html>
